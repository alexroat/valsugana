<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Forcella · navigatore offline per la montagna</title>
<link rel="canonical" href="https://forcella.app/">
<style>
  body { font: 17px/1.5 system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1f5f3f; color: #fff; text-align: center; }
  main { padding: 24px; max-width: 30em; }
  a.btn { display: inline-block; margin-top: 12px; padding: 12px 22px; border-radius: 10px; background: #fff; color: #1f5f3f; font-weight: 600; text-decoration: none; }
  small { display: block; margin-top: 18px; opacity: .8; }
</style>
<script>
  // destinazione con lo stesso hash (link condivisi: luoghi, itinerari) e la stessa query
  var to = 'https://forcella.app/' + location.search + location.hash;
  // il vecchio service worker e le mappe offline di qui non servono più: si liberano spazio e cache
  (async function () {
    try {
      if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
      if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    } catch (e) { /* si va avanti comunque */ }
    location.replace(to);
  })();
  setTimeout(function () { location.replace(to); }, 3000);
</script>
</head>
<body>
<main>
  <h1>🏔️ Valsugana Offline ora è Forcella</h1>
  <p>Navigatore offline per la montagna: Trentino, Alto Adige e dintorni.</p>
  <a class="btn" id="go" href="https://forcella.app/">Apri forcella.app</a>
  <small>Le mappe scaricate qui vanno riscaricate sul nuovo indirizzo. Se l'avevi installata, installa Forcella dal menu del browser.</small>
</main>
<script>document.getElementById('go').href = to;</script>
</body>
</html>
