<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Anteprima smartphone · Valsugana Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; gap: 48px; align-items: center; justify-content: center;
         background: radial-gradient(circle at 30% 20%, #2e7d55, #0f2f20); font-family: -apple-system, sans-serif; color: #fff; }
  .wrap { width: calc(418px * var(--k)); height: calc(872px * var(--k)); flex: none; }
  .phone { width: 418px; height: 872px; border-radius: 58px; background: #111; padding: 14px;
           box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 0 0 2px #333; position: relative;
           transform: scale(var(--k)); transform-origin: top left; }
  .screen { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; background: #000; display: flex; flex-direction: column; }
  .status { height: 47px; flex: none; color: #fff; font: 600 15px -apple-system, sans-serif; display: flex;
            justify-content: space-between; align-items: center; padding: 6px 30px 0 34px; }
  .phone::before { content: ''; position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
                   width: 110px; height: 30px; border-radius: 20px; background: #000; z-index: 2; }
  iframe { width: 390px; flex: 1; border: 0; background: #dfe7e2; }
  .info { max-width: 360px; }
  .info h1 { font-size: 28px; margin: 0 0 8px; }
  .info p { opacity: .85; line-height: 1.5; }
  .info code { background: rgba(255,255,255,.15); padding: 2px 6px; border-radius: 6px; }
  @media (max-width: 900px) { .info { display: none; } }
</style>
</head>
<body>
  <div class="wrap"><div class="phone"><div class="screen">
    <div class="status"><span id="clock">9:41</span><span>⌁ ▮▮▯ 🔋</span></div>
    <iframe src="./" allow="geolocation; camera; accelerometer; gyroscope; magnetometer"></iframe>
  </div></div></div>
  <script>
    const fit = () => document.body.style.setProperty('--k', Math.min(1, (innerHeight - 24) / 872).toFixed(3));
    addEventListener('resize', fit); fit();
    const t = new Date(); document.getElementById('clock').textContent = t.getHours() + ':' + String(t.getMinutes()).padStart(2, '0');
  </script>
  <div class="info">
    <h1>Valsugana Offline</h1>
    <p>Prototipo di PWA: mappa 3D con ortofoto, sentieri SAT, rifugi e cime, ricerca e GPS. Funziona senza campo dopo aver scaricato il pacchetto.</p>
    <p>Nessuna app da installare dallo store: si apre dal sito APT o da un QR code.</p>
  </div>
</body>
</html>
